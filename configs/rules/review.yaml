draft:
  regex_rules:
    tokens:
    - name: 不是
      pattern: 不是
      max_per_10k: 12.0
      note: 高频否定判断
    - name: 只是
      pattern: 只是
      max_per_10k: 8.0
      note: 弱转折口头禅
    - name: 而是
      pattern: 而是
      max_per_10k: 6.0
      note: 二分强调
    - name: 因为
      pattern: 因为
      max_per_10k: 10.0
      note: 因果直说
    - name: 所以
      pattern: 所以
      max_per_10k: 10.0
      note: 因果直说
    - name: 可是
      pattern: 可是
      max_per_10k: 6.0
      note: 口语转折
    - name: 却
      pattern: 却
      max_per_10k: 18.0
      note: 常见逆接
    - name: 然后
      pattern: 然后
      max_per_10k: 8.0
      note: 流水账连接
    - name: 于是
      pattern: 于是
      max_per_10k: 5.0
      note: 流程化推进
    - name: 问题在于
      pattern: 问题在于
      max_per_10k: 2.5
      note: 解释腔总结句
    - name: 仿佛
      pattern: 仿佛
      max_per_10k: 6.0
      note: 高频比喻触发词
    - name: 像是
      pattern: 像是
      max_per_10k: 7.0
      note: 抽象判断过渡
    - name: 谈不上
      pattern: 谈不上
      max_per_10k: 3.0
      note: 修正型弱否定
    - name: 算不上
      pattern: 算不上
      max_per_10k: 3.0
      note: 修正型弱否定
    - name: 不
      pattern: 不
      max_per_10k: 120.0
      note: 功能词总量观察
    - name: 是
      pattern: 是
      max_per_10k: 170.0
      note: 功能词总量观察
    patterns:
    - name: pi_status_bar
      label: Pi竖线状态栏
      pattern: 【Pi】[^\n]*｜[^\n]*
      max_per_10k: 1.5
      note: Pi 输出像系统状态栏，容易挤掉角色反应
    - name: pi_menu_prompt
      label: Pi是否菜单
      pattern: 【Pi】\s*是否[^\n]+
      max_per_10k: 1.0
      note: Pi 像按钮确认框，削弱搭档感
    - name: clue_dashboard_terms
      label: 线索面板词
      pattern: (?:归档|首屏|标签|重合|关联|归进同一组|挂上|缓存|待比对|坐标|频段|线索)
      max_per_10k: 18.0
      note: 线索被面板词收拢时，场面会像任务列表
    - name: short_conclusion_pair
      label: 这不是X是Y
      pattern: 这不是[^。！？\n]{1,20}[。！？\n]+[^。！？\n]{0,20}是[^。！？\n]{1,30}
      max_per_10k: 1.0
      note: 短结论对会替读者完成推理
    - name: assertive_judgement
      label: 肯定判断/解释腔
      pattern: (?:这是|那是|这里是|真正|其实|显然|说白了|换句话说|有些事|有些东西)[^。！？\n]{0,36}
      max_per_10k: 8.0
      note: 肯定判断和解释腔过密时，旁白会替场面下结论
    - name: ba_operation
      label: 把字操作句
      pattern: 把[^。！？\n]{1,30}
      max_per_10k: 60.0
      note: 把字句过密时，场面容易变成操作日志
    - name: simile_template
      label: 像/活像模板
      pattern: (?:活像|像是|像[^，。！？\n]{0,16}(?:一样|似的|似|有人|一块|一头|一根|一道|一只))
      max_per_10k: 18.0
      note: 比喻模板过密时，旁白会替代真实动作
    - name: negation_contrast
      label: 不是A而是B
      pattern: 不是[^。！？\n]{0,40}(?:而是|是)[^。！？\n]{0,40}
      max_per_10k: 4.0
      note: 典型模板对照句
    - name: negation_soft_turn
      label: 不是A只是B/更像B
      pattern: 不是[^。！？\n]{0,40}(?:只是|更像|倒像|倒是|问题在于)[^。！？\n]{0,40}
      max_per_10k: 4.0
      note: AI 感较强的软转折
    - name: double_negative_list
      label: 没有A也没有B
      pattern: 没有[^。！？\n]{0,24}也没有[^。！？\n]{0,24}
      max_per_10k: 2.5
      note: 并列否定反复使用会发木
    - name: affirm_then_negative
      label: 肯定后否定
      pattern: (?:当然|确实|的确|明明)[^。！？\n]{0,30}不(?:是|会|能|该|像)
      max_per_10k: 3.0
      note: 先肯定再自我转折
    - name: negative_then_affirm
      label: 否定后肯定
      pattern: 不(?:是|会|能|该)[^。！？\n]{0,30}(?:而是|反而|却|倒)
      max_per_10k: 4.0
      note: 否定后再拉回主判断
    - name: degree_to_extent
      label: 高到/近到/痛得
      pattern: '[\u4e00-\u9fffA-Za-z]{1,12}(?:高到|近到|低到|冷到|痛得|热得|亮得|黑得|静得|吵得)[^。！？\n]{0,28}'
      max_per_10k: 5.0
      note: 程度句式连续出现会模板化
    - name: dash_pair
      label: aa - bb
      pattern: '[A-Za-z\u4e00-\u9fff]{1,20}\s*[-—]\s*[A-Za-z\u4e00-\u9fff]{1,20}'
      max_per_10k: 1.5
      note: 并列对照或定义句
    - name: simile_yiyang
      label: 像……一样
      pattern: 像[^。！？\n]{0,24}一样
      max_per_10k: 3.5
      note: 明喻模板
    - name: simile_side
      label: 像……似的/那样
      pattern: 像[^。！？\n]{0,24}(?:似的|那样)
      max_per_10k: 4.0
      note: 明喻模板
    - name: de_like
      label: 得像
      pattern: '[\u4e00-\u9fffA-Za-z]{1,12}得像[^。！？\n]{0,24}'
      max_per_10k: 4.0
      note: 程度强化模板
    - name: problem_statement
      label: 问题在于/这就是
      pattern: (?:问题在于|这就是|那就是|这不是|那不是)[^。！？\n]{0,24}
      max_per_10k: 5.0
      note: 课堂总结式判断句
    phrases:
    - name: 不是因为
      pattern: 不是因为
      max_per_10k: 2.0
      note: 解释型起手
    - name: 问题不在
      pattern: 问题不在
      max_per_10k: 2.0
      note: 课堂判断句
    - name: 看起来
      pattern: 看起来
      max_per_10k: 4.0
      note: 判断先于场面
    - name: 更像
      pattern: 更像
      max_per_10k: 4.0
      note: 软修正骨架
    - name: 像是
      pattern: 像是
      max_per_10k: 7.0
      note: 抽象过渡
    - name: 至少
      pattern: 至少
      max_per_10k: 5.0
      note: 保守判断口头禅
    - name: 忽然
      pattern: 忽然
      max_per_10k: 5.0
      note: 突发提示词
    modifiers:
    - name: 微微
      pattern: 微微
      max_per_10k: 6.0
      note: 黏糊副词，容易把动作写虚
    - name: 轻轻
      pattern: 轻轻
      max_per_10k: 6.0
      note: 黏糊副词，容易削弱力度
    - name: 慢慢
      pattern: 慢慢
      max_per_10k: 6.0
      note: 推进副词重复会拖慢节奏
    - name: 有点
      pattern: 有点
      max_per_10k: 5.0
      note: 弱判断口头禅
    - name: 一点点
      pattern: 一点点
      max_per_10k: 2.5
      note: 程度补语过密会发腻
    - name: 越来越
      pattern: 越来越
      max_per_10k: 4.0
      note: 趋势句式重复
    - name: 显得
      pattern: 显得
      max_per_10k: 4.0
      note: 作者替场面下判断
    - name: 过于
      pattern: 过于
      max_per_10k: 3.0
      note: 说明腔强判断
    - name: 几乎
      pattern: 几乎
      max_per_10k: 6.0
      note: 保守强调词
    - name: 几乎没有
      pattern: 几乎没有
      max_per_10k: 2.0
      note: 双层弱否定
    punctuation:
    - name: ！
      pattern: ！
      max_per_10k: 6.0
      note: 感叹号过多会显得用力过猛
    - name: ？
      pattern: ？
      max_per_10k: 10.0
      note: 问号过多会把对话写成盘问
    - name: ……
      pattern: ……
      max_per_10k: 10.0
      note: 省略号容易养成口头禅
    - name: ——
      pattern: ——
      max_per_10k: 4.0
      note: 破折号太多会拉出解释腔
    - name: ：
      pattern: ：
      max_per_10k: 18.0
      note: 冒号过多常见于说明式文本
    punctuation_combos:
    - name: ？！/！？
      pattern: (?:？！|！？)
      max_per_10k: 1.5
      note: 强情绪标点组合
    - name: ！！
      pattern: ！！
      max_per_10k: 1.0
      note: 双感叹号
    - name: ？？
      pattern: ？？
      max_per_10k: 1.0
      note: 双问号
  template_rules:
  - name: 不是A而是B
    pattern: 不是[^。！？\n]{0,40}而是[^。！？\n]{0,40}
    note: 二分强调模板，适合硬查
    max_per_10k: 3.5
    category: contrast
  - name: 不是A只是B
    pattern: 不是[^。！？\n]{0,40}只是[^。！？\n]{0,40}
    note: 修正式否定，容易写成 AI 腔
    max_per_10k: 2.5
    category: contrast
  - name: 不是A更像B
    pattern: 不是[^。！？\n]{0,40}更像[^。！？\n]{0,40}
    note: 软转折模板，重复时会很假
    max_per_10k: 2.5
    category: contrast
  - name: 没有A也没有B
    pattern: 没有[^。！？\n]{0,24}也没有[^。！？\n]{0,24}
    note: 并列否定模板
    max_per_10k: 2.0
    category: negation
  - name: 高到近到痛得到
    pattern: '[\u4e00-\u9fffA-Za-z]{1,12}(?:高到|近到|低到|冷到|热到|痛得|亮得|黑得|静得|吵得)[^。！？\n]{0,28}'
    note: 程度推进模板
    max_per_10k: 4.5
    category: degree
  - name: 得像
    pattern: '[\u4e00-\u9fffA-Za-z]{1,12}得像[^。！？\n]{0,24}'
    note: 程度比喻骨架；对白里少量可保留，旁白连续回收时更容易露手势
    max_per_10k: 4.2
    category: degree
  - name: 像是想
    pattern: 像是想[^。！？\n]{0,30}
    note: 旁白代替动作判断
    max_per_10k: 2.5
    category: judgement
  - name: 看起来像
    pattern: 看起来[^。！？\n]{0,20}像[^。！？\n]{0,20}
    note: 判断先于画面
    max_per_10k: 2.0
    category: judgement
  - name: 说完就
    pattern: '[\u4e00-\u9fffA-Za-z]{1,12}说完就[^。！？\n]{0,24}'
    note: 说明式动作尾巴
    max_per_10k: 2.0
    category: action
  - name: 问完就
    pattern: '[\u4e00-\u9fffA-Za-z]{1,12}问完就[^。！？\n]{0,24}'
    note: 说明式动作尾巴
    max_per_10k: 1.5
    category: action
  - name: 问题不在
    pattern: 问题不在[^。！？\n]{0,30}
    note: 课堂式判断骨架
    max_per_10k: 2.0
    category: judgement
  - name: 像某种
    pattern: 像某种[^。！？\n]{0,30}
    note: 万能比喻骨架
    max_per_10k: 2.5
    category: judgement
  - name: 显得很
    pattern: 显得很[^。！？\n]{0,20}
    note: 作者直接下判断
    max_per_10k: 2.0
    category: judgement
  - name: 越来越像
    pattern: 越来越像[^。！？\n]{0,24}
    note: 趋势判断模板
    max_per_10k: 2.0
    category: judgement
  - name: 几乎没有
    pattern: 几乎没有[^。！？\n]{0,24}
    note: 双层弱否定
    max_per_10k: 2.0
    category: negation
  - name: 像在
    pattern: 像在[^。！？\n]{0,30}
    note: 旁白代行动作判断
    max_per_10k: 3.0
    category: judgement
  - name: 越A越B
    pattern: 越[^。！？\n]{0,18}越[^。！？\n]{0,18}
    note: 递进判断骨架，连续使用会发板
    max_per_10k: 2.5
    category: progression
  - name: 一A就B
    pattern: '[一刚才只要][^。！？\n]{0,18}就[^。！？\n]{0,18}'
    note: 因果直连骨架；动作推进里可少量用，连续出现才会把叙事写得过顺
    max_per_10k: 2.9
    category: progression
  - name: 有些并不
    pattern: 有些[^。！？\n]{0,18}并不[^。！？\n]{0,18}
    note: 判断修正式句法
    max_per_10k: 1.8
    category: judgement
  - name: 从来不会只会
    pattern: 从来不会[^。！？\n]{0,24}只会[^。！？\n]{0,24}
    note: 强判断二分骨架
    max_per_10k: 1.6
    category: contrast
  - name: 先后最后
    pattern: 先[^。！？\n]{0,18}后[^。！？\n]{0,18}最后[^。！？\n]{0,18}
    note: 流程说明书骨架
    max_per_10k: 1.5
    category: flow
  - name: 要是那才
    pattern: 要是[^。！？\n]{0,24}那才[^。！？\n]{0,24}
    note: 假设强调骨架
    max_per_10k: 1.5
    category: contrast
  - name: 不是问题是问题
    pattern: 不是[^。！？\n]{0,18}的问题[^。！？\n]{0,12}是[^。！？\n]{0,18}的问题
    note: 课堂总结式判断
    max_per_10k: 1.5
    category: judgement
  - name: 短并列三拍
    pattern: (?:[^，。！？\n]{2,16}[，；、]){2}[^，。！？\n]{2,16}
    note: 从现有草稿复盘出的 AA/BB 式短排比；场景铺陈和情绪加压可留少量，连续两段以上再视作清单化风险
    max_per_10k: 2.6
    category: learned-reflection
  - name: 重叠词节奏
    pattern: (?:一([\u4e00-\u9fff])\1|([\u4e00-\u9fff])\2([\u4e00-\u9fff])\3|([\u4e00-\u9fff]{2})\4)
    note: AA/AABB/ABAB式重叠词；少量能提供口气和质感，密集回收才判为手癖
    max_per_10k: 3.8
    category: learned-reflection
  inactive_template_candidates:
  - name: 动作操作
    pattern: ''
    note: 同名家族跨 Story 稳定出现，适合进入模板库或至少进入候选审阅清单。
    max_per_10k: 5.0
    category: auto_generated
    enabled: false
  - name: 短句密度
    pattern: ''
    note: 同名家族跨 Story 稳定出现，适合进入模板库或至少进入候选审阅清单。
    max_per_10k: 5.0
    category: auto_generated
    enabled: false
  - name: 局部疲劳窗口
    pattern: ''
    note: 同名家族跨 Story 稳定出现，适合进入模板库或至少进入候选审阅清单。
    max_per_10k: 5.0
    category: auto_generated
    enabled: false
  tracked_terms:
  - category: characters
    term: 雷德
    max_per_10k: 28.0
    note: 主角姓名过密时，叙述会变成点名册
  - category: characters
    term: 莉莉安
    max_per_10k: 28.0
    note: 双人戏容易把名字喊太满
  - category: characters
    term: 艾德琳
    max_per_10k: 18.0
    note: 强角色出场时要避免名字刷屏
  - category: characters
    term: 斯卡文德
    max_per_10k: 16.0
    note: 机体名重复过多会盖过场面感
  - category: characters
    term: Pi
    max_per_10k: 24.0
    note: Pi 提示多时容易挤占正文
  - category: places
    term: 栖城
    max_per_10k: 18.0
    note: 地名重复过多说明场面词不够丰富
  - category: places
    term: 公会
    max_per_10k: 18.0
    note: 制度和场面词需要替换，不要只剩公会
  - category: places
    term: 学院
    max_per_10k: 18.0
    note: 学院相关描述应有更多具体地点词
  - category: places
    term: 城外
    max_per_10k: 14.0
    note: 环境描述不能只靠城外这个统称
  - category: devices
    term: 终端
    max_per_10k: 18.0
    note: 系统文本过密时要查是否在偷写说明
  - category: devices
    term: 屏幕
    max_per_10k: 14.0
    note: 视觉载体要和其他感官信息轮换
  - category: devices
    term: 护甲
    max_per_10k: 14.0
    note: 装备词重复过多会显得记账
  - category: devices
    term: 机体
    max_per_10k: 10.0
    note: 机械体需要动作和气质词分担
  - category: actions
    term: 看了一眼
    max_per_10k: 8.0
    note: 动作替代词不够时会反复出现
  - category: actions
    term: 抬头
    max_per_10k: 10.0
    note: 常见功能动作，需要和别的动作轮换
  - category: actions
    term: 低声
    max_per_10k: 10.0
    note: 语气副词过密会削弱真正的低声场面
  - category: actions
    term: 笑了一下
    max_per_10k: 8.0
    note: 人物状态描写容易模板化
  - category: actions
    term: 没说话
    max_per_10k: 6.0
    note: 沉默不能总用同一句写
  - category: actions
    term: 看着
    max_per_10k: 10.0
    note: 持续盯视动作过密时，段落会发僵
  - category: actions
    term: 偏头
    max_per_10k: 8.0
    note: 段首小动作重复会像机械镜头调度
  - category: atmosphere
    term: 安静
    max_per_10k: 8.0
    note: 安静类形容词重复会失去压迫感
  - category: atmosphere
    term: 宁静
    max_per_10k: 4.0
    note: 同义氛围词需要分散使用
  - category: atmosphere
    term: 压抑
    max_per_10k: 6.0
    note: 氛围判断要多交给细节
  - category: style
    term: 得很
    max_per_10k: 9.5
    note: 程度尾巴反复出现时，语气会开始发滑；对白里偶发可留，旁白密集回收优先处理
  - category: actions
    term: 停在
    max_per_10k: 6.0
    note: 视线或动作总写成停在，场面容易发僵
  - category: style
    term: 冷光
    max_per_10k: 8.0
    note: 冷意象重复过多会让章末和氛围收束发木
  - category: style
    term: 夜色
    max_per_10k: 8.0
    note: 夜色类收束反复出现时，章末会模板化
  - category: style
    term: 高墙
    max_per_10k: 8.0
    note: 高墙意象频繁回收时，容易替代真实剧情收束
  - category: style
    term: 脉搏
    max_per_10k: 4.0
    note: 宏大比喻词一旦回收过多，会显出作者用力
  - category: style
    term: 忽然觉得
    max_per_10k: 2.0
    note: 判断先于画面，容易把旁白写成总结句
  - category: style
    term: 像某种
    max_per_10k: 5.0
    note: 万能比喻骨架重复时，画面会变空
  - category: style
    term: 微微
    max_per_10k: 6.0
    note: 黏糊副词高频时，动作会越来越虚
  - category: style
    term: 轻轻
    max_per_10k: 6.0
    note: 轻描副词反复出现时，力度会被冲掉
  - category: style
    term: 慢慢
    max_per_10k: 6.0
    note: 推进副词太密时，叙述会拖
  - category: style
    term: 有点
    max_per_10k: 5.0
    note: 弱判断口头禅
  - category: style
    term: 显得
    max_per_10k: 4.0
    note: 作者判断词过密，场面自己说话的空间会变少
  - category: style
    term: 过于
    max_per_10k: 3.0
    note: 说明腔强判断
  - category: style
    term: 直接
    max_per_10k: 7.0
    note: 推进副词过密会显得太直给
  - category: style
    term: 立刻
    max_per_10k: 6.0
    note: 即时反应词连续出现会发硬
  - category: style
    term: 一下
    max_per_10k: 10.0
    note: 弱化动作的小尾巴，过多会发黏
  - category: style
    term: 一瞬
    max_per_10k: 4.0
    note: 时间切片词重复会显得作者在举牌
  - category: style
    term: 本能
    max_per_10k: 3.0
    note: 心理判断词过多会替角色下结论
