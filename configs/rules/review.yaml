  regex:
    style_leak:
      pattern: (作者|读者|观众|正文|文风|写法|好看|爽点|悬疑感|节奏感|氛围感|像小说家一样写|让读者)
    abstract_lookpoint:
      pattern: (很坚定|很压抑|很可爱|气氛|氛围|更有感觉|更好看|有张力|有味道|沉稳|冷静|好笑)
    answer_leak:
      pattern: (幕后黑手|其实是|实际是|本质上是|确认是|确定是|真相就是|答案就是)
    scene_leak:
      pattern: \bScene\b|场景划分|章节安排|ch\d+
      ignore_case: true
    prose_leak:
      pattern: '[。！？]{2,}|“.+?”'
    judgement:
      pattern: (局势更复杂|关系更近|更严重|更麻烦|不对劲|有问题|不简单)
    hookish:
      pattern: (钩子|悬念|吊一下|故意留白给读者)
    foreshadow_id:
      pattern: F-\d{2}
    rhythm_style_leak:
      pattern: (文风|像小说|写得|好看|悬疑)
    story_prose_leak:
      pattern: 完整正文
