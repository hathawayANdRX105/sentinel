styles:
  - id: webnovel
    name: 网文爽文
    description: 快节奏、对话驱动、章末留钩子。每几百字一个小爽点，忌长篇大论的环境描写。
    expect:
      - 短句连发（≤15字）制造节奏
      - 对话驱动场面推进
      - 章末钩子（新危机/新信息）
    forbid:
      - 解释腔替读者下结论
      - 把字操作句连发（操作日志感）
      - 没有A也没有B 类模板对照
    samples:
      - "他冷笑一声：'你也配？'"
      - "血顺着剑脊滴下来。一步。又一步。"
  - id: wuxia
    name: 传统武侠
    description: 含蓄留白，动作具体，重意境轻设定。打斗不写满，留一分给读者想。
    expect:
      - 动作具体可感
      - 留白与意境
    forbid:
      - 系统面板式信息倾倒
      - 情绪直说（眼中闪过复杂的情绪）
    samples:
      - "剑出鞘三寸，又停住。风过，竹叶落尽。"
