styles:
  - id: light-novel
    name: 轻小说
    description: 口语化、内心独白多、颜文字点缀吐槽。节奏轻快，角色感强。
    expect:
      - 内心独白用第一人称
      - 对话口语化，不端着
      - 吐槽处用颜文字点缀
    forbid:
      - 解释腔替读者下结论
      - 书面语长句堆砌
    samples:
      - "喂喂，这展开是不是有点太突然了？(°Д°)"
    kaomoji:
      无语:
        - "(°Д°)"
        - "(￣▽￣\")"
        - "(๑•́ ₃ •̀๑)"
      开心:
        - "(≧▽≦)"
        - "(☆▽☆)"
        - "(≧ω≦)"
      委屈:
        - "(｡•́︿•̀｡)"
        - "(T_T)"
        - "(｡í _ ì｡)"
      得意:
        - "(￣ω￣)"
        - "(๑¯◡¯๑)"
    kaomoji_cap_per_10k: 30
  - id: dnd
    name: DND 文字冒险
    description: 第二人称叙述，强调选择后果与感官细节。规则判定由系统负责，叙述只负责呈现。
    expect:
      - 第二人称「你」推进
      - 动作后果即时可见
      - 环境感官细节（气味/光线/声响）
    forbid:
      - 替玩家做决定
      - 情绪直说
    glossary:
      先攻: "回合开始时按敏捷判定的行动顺序"
      豁免: "对抗法术/陷阱时的属性检定，成功则效果减半或免疫"
      短休: "约一小时的休整，可消耗生命骰恢复 HP"
