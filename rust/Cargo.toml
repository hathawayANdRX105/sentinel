[package]
name = "sentinel"
version = "0.1.0"
edition = "2021"
description = "小说大纲/草稿审查与统计工具（Rust 重写）"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true